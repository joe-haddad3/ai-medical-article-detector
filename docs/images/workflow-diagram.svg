<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 556" width="760" height="556" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
<title>AI Medical Article Detector: workflow map</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#BDBBB4"/></marker></defs>
<rect width="760" height="556" rx="12" fill="#FFFFFF"/>
<text x="24" y="30" font-size="15" font-weight="600" fill="#1F1E1D">Both lanes share one Rule Scorer, then split back to their own outputs</text>
<text x="24" y="60" font-size="11.5" font-weight="600" fill="#5F5E5A">DAILY LANE</text>
<text x="24" y="332" font-size="11.5" font-weight="600" fill="#5F5E5A">EMAIL LANE</text>
<g fill="none" stroke="#BDBBB4" stroke-width="1.25"><path d="M104 122V138" marker-end="url(#a)"/><path d="M104 190V206" marker-end="url(#a)"/><path d="M104 394V410" marker-end="url(#a)"/><path d="M104 462V478" marker-end="url(#a)"/><path d="M184 232H288V274" marker-end="url(#a)"/><path d="M184 504H288V326" marker-end="url(#a)"/><path d="M368 300H400" marker-end="url(#a)"/><path d="M472 264V96H576" marker-end="url(#a)"/><path d="M472 336V368H576" marker-end="url(#a)"/><path d="M656 122V138" marker-end="url(#a)"/><path d="M656 190V206" marker-end="url(#a)"/><path d="M656 394V410" marker-end="url(#a)"/><path d="M656 462V478" marker-end="url(#a)"/></g>
<rect x="24.0" y="70.0" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#BDBBB4" stroke-width="1.25"/><text x="104" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1E1D">Daily Trigger</text><text x="104" y="109" text-anchor="middle" font-size="11.5" fill="#5F5E5A">every day at 08:00</text>
<rect x="24.0" y="138.0" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#BDBBB4" stroke-width="1.25"/><text x="104" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1E1D">3 article sources</text><text x="104" y="177" text-anchor="middle" font-size="11.5" fill="#5F5E5A">PubMed, Zenodo, EPMC</text>
<rect x="24.0" y="206.0" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#BDBBB4" stroke-width="1.25"/><text x="104" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1E1D">Merge + Dedupe</text><text x="104" y="245" text-anchor="middle" font-size="11.5" fill="#5F5E5A">max 10, 4 per source</text>
<rect x="24.0" y="342.0" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#BDBBB4" stroke-width="1.25"/><text x="104" y="364" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1E1D">Email Trigger</text><text x="104" y="381" text-anchor="middle" font-size="11.5" fill="#5F5E5A">unread mail (IMAP)</text>
<rect x="24.0" y="410.0" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#BDBBB4" stroke-width="1.25"/><text x="104" y="432" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1E1D">Skip own + extract</text><text x="104" y="449" text-anchor="middle" font-size="11.5" fill="#5F5E5A">PDF, DOCX or body</text>
<rect x="24.0" y="478.0" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#BDBBB4" stroke-width="1.25"/><text x="104" y="500" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1E1D">Normalize Email</text><text x="104" y="517" text-anchor="middle" font-size="11.5" fill="#5F5E5A">same 5 fields</text>
<rect x="208.0" y="274.0" width="160" height="52" rx="8" fill="#E8F0FB" stroke="#2F6FDB" stroke-width="2"/><text x="288" y="296" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1E1D">Rule Scorer</text><text x="288" y="313" text-anchor="middle" font-size="11.5" fill="#1F1E1D">+ Tag Source Type</text>
<polygon points="400,300 472,264 544,300 472,336" fill="#FFFFFF" stroke="#BDBBB4" stroke-width="1.25"/>
<text x="472" y="296" text-anchor="middle" font-size="12" fill="#1F1E1D">Is Ingest</text>
<text x="472" y="311" text-anchor="middle" font-size="12" fill="#1F1E1D">Source?</text>
<text x="464" y="190" text-anchor="end" font-size="11.5" fill="#5F5E5A">false: daily items</text>
<text x="464" y="384" text-anchor="end" font-size="11.5" fill="#5F5E5A">true: email items</text>
<rect x="576.0" y="70.0" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#BDBBB4" stroke-width="1.25"/><text x="656" y="92" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1E1D">Groq AI judge</text><text x="656" y="109" text-anchor="middle" font-size="11.5" fill="#5F5E5A">all texts, 1 request</text>
<rect x="576.0" y="138.0" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#BDBBB4" stroke-width="1.25"/><text x="656" y="160" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1E1D">Combine scores</text><text x="656" y="177" text-anchor="middle" font-size="11.5" fill="#5F5E5A">flag at 70%</text>
<rect x="576.0" y="206.0" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#BDBBB4" stroke-width="1.25"/><text x="656" y="228" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1E1D">Email + GitHub</text><text x="656" y="245" text-anchor="middle" font-size="11.5" fill="#5F5E5A">report, articles.json</text>
<rect x="576.0" y="342.0" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#BDBBB4" stroke-width="1.25"/><text x="656" y="364" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1E1D">Groq AI judge</text><text x="656" y="381" text-anchor="middle" font-size="11.5" fill="#5F5E5A">same prompt</text>
<rect x="576.0" y="410.0" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#BDBBB4" stroke-width="1.25"/><text x="656" y="432" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1E1D">Combine (Ingest)</text><text x="656" y="449" text-anchor="middle" font-size="11.5" fill="#5F5E5A">flag at 60%</text>
<rect x="576.0" y="478.0" width="160" height="52" rx="8" fill="#FFFFFF" stroke="#BDBBB4" stroke-width="1.25"/><text x="656" y="500" text-anchor="middle" font-size="13" font-weight="600" fill="#1F1E1D">Scan reply email</text><text x="656" y="517" text-anchor="middle" font-size="11.5" fill="#5F5E5A">result card</text>
</svg>